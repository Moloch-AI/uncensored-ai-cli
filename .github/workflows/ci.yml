name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Installs the molochai SDK from its git tag through the normal dependency.
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing

  integration:
    name: Integration (mock server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the mock server
        uses: actions/checkout@v7
        with:
          repository: Moloch-AI/uncensored-ai-api
          ref: v0.1.0
          path: uncensored-ai-api
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Start the mock server
        run: |
          nohup node uncensored-ai-api/mock-server/server.mjs --port 4010 --quiet > mock.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4010/health; then exit 0; fi
            sleep 1
          done
          echo "The mock server did not start:" >&2
          cat mock.log >&2
          exit 1
      - name: Integration tests
        run: pytest tests/integration -v
        env:
          MOLOCHAI_MOCK_BASE_URL: http://127.0.0.1:4010/api/v1
      - name: Scripted smoke run
        env:
          MOLOCHAI_BASE_URL: http://127.0.0.1:4010/api/v1
          MOLOCHAI_API_KEY: mock-key
          MOLOCHAI_CONFIG_DIR: ${{ runner.temp }}/molochai
        run: |
          set -euo pipefail
          molochai --version
          molochai models
          molochai account
          answer=$(molochai ask --no-stdin "Hello from CI")
          test "$answer" = "Mock reply from glm-5.3-flash: Hello from CI"
          echo "notes from a pipe" | molochai ask "Summarize this" --model gemma4-26b-a4b-qat
          molochai ask --no-stdin --json "Hello" | python -c "import json, sys; d = json.load(sys.stdin); assert d['choices'][0]['message']['content'].startswith('Mock reply')"
          printf 'Hello\n/usage\n/exit\n' | molochai chat
          set +e
          molochai ask --no-stdin "[mock:quota] hi"
          code=$?
          set -e
          test "$code" -eq 1

  build:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel and run it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/molochai --version
