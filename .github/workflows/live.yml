name: Live API

# Opt-in tests of the CLI against the real API (tests/live). The unauthenticated tier runs the
# CLI with an invalid key and costs nothing; it always runs. The authenticated tier needs the
# MOLOCHAI_API_KEY repository secret and is skipped when the secret is not set. See
# CONTRIBUTING.md.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  live:
    name: Live tests (api.molochai.dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Installs the molochai SDK from its git tag through the normal dependency.
      - run: python -m pip install -e ".[dev]"
      - name: Live tests
        env:
          MOLOCHAI_LIVE: "1"
          MOLOCHAI_API_KEY: ${{ secrets.MOLOCHAI_API_KEY }}
        run: |
          if [ -z "$MOLOCHAI_API_KEY" ]; then
            echo "::notice title=Live tests::The MOLOCHAI_API_KEY secret is not set: only the unauthenticated tier runs, the authenticated tests are skipped."
          fi
          pytest tests/live -v -rs
