[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "molochai-cli"
dynamic = ["version"]
description = "Terminal chat client for the MolochAI API (less-restricted open-weight models), built on the molochai Python SDK."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MolochAI" }]
keywords = ["molochai", "llm", "cli", "chat", "terminal", "openai-compatible", "uncensored"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Typing :: Typed",
]
# The SDK is not on PyPI yet; it is installed from its release tag on GitHub.
dependencies = ["molochai @ git+https://github.com/Moloch-AI/uncensored-ai-python@v0.1.1"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=6.1",
]

[project.scripts]
molochai = "molochai_cli.cli:main"

[project.urls]
Homepage = "https://molochai.dev/?utm_source=github&utm_medium=oss&utm_campaign=uncensored-ai-cli"
Documentation = "https://molochai.dev/docs?utm_source=github&utm_medium=oss&utm_campaign=uncensored-ai-cli"
Repository = "https://github.com/Moloch-AI/uncensored-ai-cli"
Issues = "https://github.com/Moloch-AI/uncensored-ai-cli/issues"
Changelog = "https://github.com/Moloch-AI/uncensored-ai-cli/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/molochai_cli/_version.py"

[tool.hatch.metadata]
# Needed for the git+https dependency on the SDK.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/molochai_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/molochai_cli", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PT", "RET", "PIE", "T20"]
ignore = ["RUF022"]

[tool.ruff.lint.per-file-ignores]
"src/molochai_cli/links.py" = ["E501"]
"tests/*" = ["T20", "PT012"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rfE"
filterwarnings = ["error", "default::DeprecationWarning", "default::PendingDeprecationWarning"]

[tool.coverage.run]
source = ["molochai_cli"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]
